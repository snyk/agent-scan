[package]
name = "agent-scan-rust"
version = "0.1.0"
edition = "2024"
description = "Experimental additive local skill inspector for snyk-agent-scan"
license = "Apache-2.0"
publish = false

[[bin]]
name = "snyk-agent-scan-rust"
path = "rust/src/main.rs"

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
sha2 = "0.10.9"
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.24.0"
