<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title description">
  <title id="title">Agent Scan compact risk report</title>
  <desc id="description">Default Agent Scan v0.6 terminal output. Clean components show discovered item counts, while risky components show affected items and compact summaries of the remaining discovery.</desc>
  <style>
    .terminal { fill: #17171c; }
    .text { fill: #e6e6e9; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 14px; }
    .bold { font-weight: 700; }
    .muted { fill: #9a9aa2; }
    .clean { fill: #28a745; }
    .low { fill: #ECD9FF; }
    .high { fill: #C794FF; }
    .critical { fill: #B36DFF; }
  </style>

  <rect class="terminal" width="1000" height="640" rx="12"/>
  <circle cx="26" cy="25" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="25" r="6" fill="#febc2e"/>
  <circle cx="66" cy="25" r="6" fill="#28c840"/>

  <g class="text">
    <text x="24" y="65" class="bold">Snyk Agent Scan v0.6.0</text>

    <text x="24" y="103">● Scanning <tspan class="bold">~/.cursor/mcp.json</tspan><tspan class="muted"> found 2 mcp servers and 1 skill</tspan></text>
    <text x="24" y="131">│</text>

    <text x="24" y="159">├── <tspan class="bold critical">github</tspan> 2 risks</text>
    <text x="58" y="187" class="critical">● <tspan class="bold">Prompt injection in tool (1000/1000)</tspan><tspan class="text">: Hidden instructions target the agent.</tspan></text>
    <text x="78" y="213"><tspan class="bold muted">Affected tools: </tspan>create_pull_request</text>
    <text x="58" y="241" class="low">● <tspan class="bold">Dangerous words (100/1000)</tspan><tspan class="text">: Manipulative wording found.</tspan></text>
    <text x="78" y="267"><tspan class="bold muted">Affected tools: </tspan>search_code</text>
    <text x="58" y="295">├── tool         <tspan class="bold">create_pull_request</tspan></text>
    <text x="58" y="321">├── tool         <tspan class="bold">search_code</tspan></text>
    <text x="58" y="347" class="muted">└── and 6 more tools, 2 resources</text>

    <text x="24" y="383">├── <tspan class="bold clean">playwright</tspan><tspan class="muted">  5 tools, 2 resources</tspan></text>

    <text x="24" y="419">└── <tspan class="bold high">release-helper</tspan> 1 risk</text>
    <text x="58" y="447" class="high">● <tspan class="bold">Suspicious download URL (600/1000)</tspan><tspan class="text">: Downloads an untrusted executable.</tspan></text>
    <text x="78" y="473"><tspan class="bold muted">Locations: </tspan>scripts/install.sh:12</text>
    <text x="78" y="499"><tspan class="bold muted">Malicious URLs: </tspan>https://downloads.example.invalid/install.sh</text>
    <text x="58" y="527">├── script       <tspan class="bold">scripts/install.sh</tspan></text>
    <text x="58" y="553" class="muted">└── and 1 instruction, 1 more script, 2 assets</text>

    <text x="24" y="601" class="muted">Use --show-full-discovery to list every discovered entity and skill file.</text>
  </g>
</svg>
